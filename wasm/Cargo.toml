[package]
name = "compliant-privacy-stablecoin-wasm"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde-wasm-bindgen = "0.6"
compliant-privacy-stablecoin-client = { path = "../client" }
compliant-privacy-stablecoin-circuits = { path = "../circuits" }
ark-bn254 = "0.4.0"
ark-ff = "0.4.0"
ark-ec = "0.4.0"
ark-serialize = "0.4.0"
hex = "0.4"
rand = "0.8"
sha2 = "0.10"
console_error_panic_hook = "0.1.7"
getrandom = { version = "0.2", features = ["js"] }
